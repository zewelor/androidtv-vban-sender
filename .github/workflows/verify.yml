name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify sender
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build APKs and verify sender lifecycle
        run: sh tools/build.sh
      - name: Keep APKs and synthetic test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vban-test-build
          path: |
            build/e2e/
            build/vban-engine.jar
            build/vban-engine.jar.sha256
            build/vban.apk
            build/vban.apk.sha256
            build/vban-dev.apk
            build/vban-dev.apk.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Sign normal APK with the retained release key
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          : "${RELEASE_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Missing release password secret}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/vban-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.p12"
          printf '%s\n' "$RELEASE_KEYSTORE_PASSWORD" > "$signing_dir/password.txt"
          unset RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD
          sh tools/sign-release.sh "$signing_dir/release.p12" "$signing_dir/password.txt"
      - name: Keep release-signed APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vban-release-build
          path: |
            build/vban-release.apk
            build/vban-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
