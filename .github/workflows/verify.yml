name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify sender
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build APKs and verify sender lifecycle
        run: sh tools/build.sh
      - name: Keep APKs and synthetic test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vban-test-build
          path: |
            build/e2e/
            build/vban-engine.jar
            build/vban-engine.jar.sha256
            build/vban.apk
            build/vban.apk.sha256
            build/vban-dev.apk
            build/vban-dev.apk.sha256
          if-no-files-found: error
          retention-days: 7
